# Dev only. No published ports: the shared Traefik (`svc-traefik`) joins this
# instance's network and routes http://site.<instance>.localhost. Run via `task`.
name: ${COMPOSE_PROJECT_NAME:?empty — run through `task`, which derives it from the worktree}

services:
  site:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --port 4321"
    environment:
      HMR_CLIENT_PORT: "80"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    labels:
      - "traefik.enable=true"
      - "dev.expose=true"
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME}_default"
      - "traefik.http.services.site-${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=4321"

volumes:
  node_modules:
    name: ${COMPOSE_PROJECT_NAME}_node_modules
